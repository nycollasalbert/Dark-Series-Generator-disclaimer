<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=WEBSITE_INDEX.html">
  <title>Dark Series Generator</title>
  <meta name="description" content="Documentos legais do Dark Series Generator: termos de uso, politica de privacidade e disclaimer.">
  <style>
    :root {
      --bg: #0b0b0f;
      --card: #15151d;
      --text: #ffffff;
      --muted: #a1a1aa;
      --accent: #ff6a00;
      --line: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        var(--bg);
      background-size: 44px 44px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(100%, 520px);
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02)), var(--card);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      text-align: center;
    }

    .mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--accent);
      color: #111;
      font-weight: 900;
      font-size: 24px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 7vw, 44px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0 auto 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 8px;
      background: var(--accent);
      color: #111;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">D</div>
    <h1>Dark Series Generator</h1>
    <p>Redirecionando para os documentos legais do aplicativo.</p>
    <a href="WEBSITE_INDEX.html">Abrir pagina inicial</a>
  </main>
</body>
</html>
